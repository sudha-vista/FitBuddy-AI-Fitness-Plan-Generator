<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}FitBuddy{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head><body>
<header class="topbar"><a class="brand" href="/">FitBuddy</a>
<nav><a href="/">Create Plan</a><a href="/view-all-users">Admin View</a><a href="/docs">API Docs</a></nav></header>
<main class="container">
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
{% if message %}<div class="alert success">{{ message }}</div>{% endif %}
{% block content %}{% endblock %}
</main><footer><p>FitBuddy is an educational wellness tool, not medical advice.</p></footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body></html>
